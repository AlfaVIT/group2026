<h3 class="H3">Ныне отпускаешь </h3>
<p class="P"><span class="Red">Н</span> Ныне отпускаешь Ты с миром слугу Твоего,<br>
исполнив слово Твоё, Владыка,</p>
<p class="P">ибо видели очи мои спасение Твоё,<br>
угото́ванное Тобою для всех народов —</p>
<p class="P">свет для просвещения язычников<br>
и славу народа Твоего, Израиля.</p>
