<h4 class="H4">Кондак воскресения, глас 5</h4>
<p class="P">До ада нисшёл Ты, Спаситель мой, <span class="Red">/</span> и, Всесильный, разбил врата <em>его</em>, <span class="Red">/</span> уме́рших воскресил с Собой как Создатель. <span class="Red">/</span> О Христос, Ты жало смерти сокрушил <span class="Red">/</span> и Адама от проклятия избавил, о Человеколюбивый, — <span class="Red">/</span> посему мы все взываем: <span class="Red">//</span> «Спаси нас, Господи!»</p>
